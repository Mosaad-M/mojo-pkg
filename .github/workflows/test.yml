name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Vendored tcp matches the pinned release
        # src/tcp.mojo is a copy of the tcp package; it must equal the release
        # pinned here (bump both together when vendoring a new tcp)
        run: |
          git clone --quiet --depth 1 --branch v2.0.2 https://github.com/Mosaad-M/tcp.git ../tcp_pinned
          cmp src/tcp.mojo ../tcp_pinned/tcp.mojo || { echo "src/tcp.mojo differs from tcp v2.0.2: re-vendor it"; exit 1; }

      - name: Clone tls
        run: |
          git clone https://github.com/Mosaad-M/tls.git ../tls_pure
          git -C ../tls_pure checkout 930623b31bad0ce642df09ba7c682e585c7748e2

      - name: Install pixi
        uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4

      - name: Run all tests
        run: pixi run test

  build-and-smoke:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Clone tls
        run: |
          git clone https://github.com/Mosaad-M/tls.git ../tls_pure
          git -C ../tls_pure checkout 930623b31bad0ce642df09ba7c682e585c7748e2

      - name: Install pixi
        uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4

      - name: Build binary
        run: pixi run build

      - name: Smoke test
        run: |
          ~/.mojo/bin/mojo-pkg version | grep -q "mojo-pkg"
          ~/.mojo/bin/mojo-pkg help 2>&1 | grep -q "install"
          echo "PASS: binary smoke tests"

      - name: E2E resolve against the live index
        run: bash scripts/e2e_resolve.sh ~/.mojo/bin/mojo-pkg

      - name: Index fetch via the GitHub API fallback (live)
        run: pixi run test-index-live
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test-macos:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Clone tls
        run: |
          git clone https://github.com/Mosaad-M/tls.git ../tls_pure
          git -C ../tls_pure checkout 930623b31bad0ce642df09ba7c682e585c7748e2

      - name: Install pixi
        uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4

      - name: Run all tests
        run: pixi run test

  build-and-smoke-macos:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Clone tls
        run: |
          git clone https://github.com/Mosaad-M/tls.git ../tls_pure
          git -C ../tls_pure checkout 930623b31bad0ce642df09ba7c682e585c7748e2

      - name: Install pixi
        uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4

      - name: Build binary
        run: pixi run build

      - name: Smoke test
        run: |
          ~/.mojo/bin/mojo-pkg version | grep -q "mojo-pkg"
          ~/.mojo/bin/mojo-pkg help 2>&1 | grep -q "install"
          echo "PASS: binary smoke tests"

      - name: E2E resolve against the live index
        run: bash scripts/e2e_resolve.sh ~/.mojo/bin/mojo-pkg

      - name: Index fetch via the GitHub API fallback (live)
        run: pixi run test-index-live
        env:
          GITHUB_TOKEN: ${{ github.token }}
